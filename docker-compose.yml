services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-doc-classifier-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${APP_DIR}/ollama:/root/.ollama
    environment:
      - TZ=${TZ:-America/Anchorage}

  model-init:
    image: ollama/ollama:latest
    container_name: local-doc-classifier-model-init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - CLASSIFY_MODEL=${CLASSIFY_MODEL:-qwen2.5:3b}
      - VISION_MODEL=${VISION_MODEL:-qwen2.5vl:3b}
      - PULL_VISION_MODEL=${PULL_VISION_MODEL:-1}
      - TZ=${TZ:-America/Anchorage}
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      '
      echo "[INFO] Waiting for Ollama...";
      until ollama list >/dev/null 2>&1; do sleep 2; done;
      echo "[INFO] Pulling classification model: $CLASSIFY_MODEL";
      ollama pull "$CLASSIFY_MODEL";
      if [ "$PULL_VISION_MODEL" = "1" ]; then
        echo "[INFO] Pulling vision model: $VISION_MODEL";
        ollama pull "$VISION_MODEL" || echo "[WARN] Vision model pull failed; text classification still works.";
      fi;
      echo "[DONE] Model initialization complete.";
      '
    profiles:
      - init

  classifier:
    build:
      context: ./classifier
    image: local-doc-classifier-worker:latest
    container_name: local-doc-classifier-worker
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434
      - CLASSIFY_MODEL=${CLASSIFY_MODEL:-qwen2.5:3b}
      - VISION_MODEL=${VISION_MODEL:-qwen2.5vl:3b}
      - TZ=${TZ:-America/Anchorage}
    volumes:
      - ${APP_DIR}/input:/input
      - ${APP_DIR}/output:/output
      - ${VAULT_DIR}:/vault
      - ${APP_DIR}/cache:/root/.cache
      - ${APP_DIR}/logs:/logs
      - ${APP_DIR}/tmp:/tmp/work
      - ${APP_DIR}/config:/config
    profiles:
      - tools

  api:
    build:
      context: ./classifier
    image: local-doc-classifier-worker:latest
    container_name: local-doc-classifier-api
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "${CLASSIFIER_API_BIND:-0.0.0.0}:${CLASSIFIER_API_PORT:-4319}:8080"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - CLASSIFY_MODEL=${CLASSIFY_MODEL:-qwen2.5:3b}
      - VISION_MODEL=${VISION_MODEL:-qwen2.5vl:3b}
      - CLASSIFIER_API_TOKEN=${CLASSIFIER_API_TOKEN}
      - TZ=${TZ:-America/Anchorage}
    volumes:
      - ${APP_DIR}/input:/input
      - ${APP_DIR}/output:/output
      - ${VAULT_DIR}:/vault
      - ${APP_DIR}/cache:/root/.cache
      - ${APP_DIR}/logs:/logs
      - ${APP_DIR}/tmp:/tmp/work
      - ${APP_DIR}/config:/config
    entrypoint:
      - python
      - -m
      - uvicorn
      - api_server:APP
      - --host
      - 0.0.0.0
      - --port
      - "8080"

  taxonomy-router:
    build:
      context: ./taxonomy-router
    image: local-doc-classifier-taxonomy-router:latest
    container_name: local-doc-classifier-taxonomy-router
    volumes:
      - ${APP_DIR}/config:/opt/local-doc-classifier/config
    profiles:
      - tools
